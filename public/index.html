<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>Beacon — Real-Time Disaster Rescue & Emergency Coordination</title>
<meta name="description" content="Mission-critical disaster rescue coordination platform connecting trapped or injured victims with verified volunteer responders in real time." />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Socket.io Client -->
<script src="/socket.io/socket.io.js"></script>

<style>
  :root {
    --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Inter', sans-serif;

    --bg-base: #090D14;
    --bg-surface: #101623;
    --bg-surface-elevated: #162032;
    --bg-surface-hover: #1E2B42;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);

    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;

    --sos-crimson: #EF4444;
    --sos-crimson-dim: rgba(239, 68, 68, 0.14);
    --sos-crimson-glow: rgba(239, 68, 68, 0.35);

    --safe-emerald: #10B981;
    --safe-emerald-dim: rgba(16, 185, 129, 0.14);

    --signal-blue: #3B82F6;
    --signal-blue-dim: rgba(59, 130, 246, 0.14);

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-pill: 9999px;

    --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.35);
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);

    --transition-fast: 0.16s ease;
    --transition-norm: 0.24s cubic-bezier(0.16, 1, 0.3, 1);
  }

  [data-theme="light"] {
    --bg-base: #F4F6F9;
    --bg-surface: #FFFFFF;
    --bg-surface-elevated: #F8FAFC;
    --bg-surface-hover: #F1F5F9;
    --border-subtle: rgba(0, 0, 0, 0.08);
    --border-strong: rgba(0, 0, 0, 0.16);

    --text-primary: #0F172A;
    --text-secondary: #475569;
    --text-muted: #64748B;

    --sos-crimson: #DC2626;
    --safe-emerald: #059669;
    --signal-blue: #2563EB;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-main);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    line-height: 1.5;
  }

  .page-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.06) 0%, transparent 60%);
  }

  #app-container {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-surface);
    border-left: 1px solid var(--border-subtle);
    border-right: 1px solid var(--border-subtle);
    box-shadow: var(--shadow-card);
    position: relative;
    transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #app-container.wide-mode { max-width: 1180px; }

  /* NAVIGATION & TOP BAR */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(16, 22, 35, 0.88);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .brand-group { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .brand-logo-radar {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, var(--sos-crimson) 0%, #B91C1C 100%);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }

  .brand-title { font-weight: 800; font-size: 18px; letter-spacing: -0.4px; display: flex; align-items: center; gap: 8px; }
  .brand-badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    background: var(--sos-crimson-dim); color: var(--sos-crimson); padding: 2px 7px;
    border-radius: var(--radius-pill); border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .top-actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border-subtle);
    background: var(--bg-surface-elevated); color: var(--text-secondary);
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition-fast);
  }
  .icon-btn.voice-active { background: var(--sos-crimson); color: #fff; border-color: var(--sos-crimson); animation: pulseVoice 1.5s infinite; }
  @keyframes pulseVoice { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }

  .nav-menu-bar {
    background: var(--bg-surface-elevated); border-bottom: 1px solid var(--border-subtle);
    padding: 8px 16px; display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
  }
  .nav-tab {
    font-size: 13px; font-weight: 600; color: var(--text-secondary); padding: 6px 14px;
    border-radius: var(--radius-pill); cursor: pointer; border: 1px solid transparent; background: transparent; transition: var(--transition-fast);
  }
  .nav-tab.active { background: var(--signal-blue-dim); color: var(--signal-blue); border-color: rgba(59, 130, 246, 0.3); }

  /* VOICE NAV HUD BANNER */
  .voice-hud {
    background: linear-gradient(90deg, rgba(239, 68, 68, 0.15) 0%, rgba(59, 130, 246, 0.15) 100%);
    border-bottom: 1px solid var(--border-subtle); padding: 10px 16px; font-size: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  /* SCREENS */
  .screen { flex: 1; display: flex; flex-direction: column; padding: 24px 20px 80px; gap: 20px; }
  .hidden { display: none !important; }

  h1.screen-title { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.2; }
  p.screen-lede { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }

  /* 10K BANNER */
  .rescued-counter-banner {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(16, 22, 35, 0.9) 100%);
    border: 1px solid rgba(16, 185, 129, 0.35); border-radius: var(--radius-lg); padding: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .rescued-number { font-size: 38px; font-weight: 800; font-family: var(--font-mono); color: var(--safe-emerald); line-height: 1; }

  /* CARDS & GRIDS */
  .choice-container { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 768px) { .wide-mode .choice-container { grid-template-columns: 1fr 1fr; } }

  .choice-card-pro {
    background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
    padding: 22px; cursor: pointer; text-align: left; color: var(--text-primary); transition: var(--transition-norm);
  }
  .choice-card-pro.sos-card { background: linear-gradient(180deg, rgba(239, 68, 68, 0.16) 0%, var(--bg-surface-elevated) 80%); border-color: rgba(239, 68, 68, 0.4); }

  .feature-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 640px) { .feature-grid { grid-template-columns: 1fr 1fr; } }
  .feature-card { background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 8px; }

  /* DISASTER IMPACT CARDS */
  .disaster-card {
    background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
    overflow: hidden; display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px;
  }
  .disaster-img { width: 100%; height: 210px; object-fit: cover; }
  .disaster-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .rescue-share-tag {
    background: var(--safe-emerald-dim); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-sm);
    padding: 10px 14px; font-size: 13px; color: var(--safe-emerald); font-weight: 700; display: flex; justify-content: space-between;
  }

  .btn { border: none; border-radius: var(--radius-md); padding: 14px 20px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
  .btn-sos-main { background: linear-gradient(135deg, var(--sos-crimson) 0%, #C51E1E 100%); color: #FFFFFF; }
  .btn-safe-main { background: linear-gradient(135deg, var(--safe-emerald) 0%, #047857 100%); color: #FFFFFF; }

  .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 10000; }
  .toast-bubble { background: var(--bg-surface-elevated); color: var(--text-primary); border: 1px solid var(--border-strong); padding: 12px 20px; border-radius: var(--radius-pill); font-size: 13.5px; font-weight: 600; }
</style>
</head>
<body>

<div class="page-wrapper">
  <div id="app-container">

    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="brand-group" onclick="goLanding()">
        <div class="brand-logo-radar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </div>
        <div class="brand-title">BEACON <span class="brand-badge">LIVE OPS</span></div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="voiceNavBtn" onclick="toggleVoiceNavigation()" title="Hands-Free Voice Navigation">🎙️</button>
        <button class="icon-btn" onclick="toggleWideMode()" title="Expand Dashboard View">🖥️</button>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
      </div>
    </header>

    <!-- VOICE NAVIGATION ASSISTANT HUD -->
    <div class="voice-hud hidden" id="voiceHud">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="color:var(--sos-crimson);font-weight:700;">🎙️ VOICE COMMANDS ACTIVE:</span>
        <span id="voiceStatusTxt" style="color:var(--text-secondary);">Say "Help", "Features", "Contributions", "Home", or "Siren"</span>
      </div>
      <button onclick="toggleVoiceNavigation()" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-weight:700;">✕</button>
    </div>

    <!-- TABS -->
